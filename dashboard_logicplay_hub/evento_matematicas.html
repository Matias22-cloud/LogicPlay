<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" href="https://logic-play-one.vercel.app/LogicPlay.ico" type="image/x-icon">
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script>
        if (!localStorage.getItem('logicplay_auth')) {{
            window.location.replace('landing.html');
        }}
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <script id="tailwind-config">
        tailwind.config = {{
            darkMode: "class",
            theme: {{
                extend: {{
                    colors: {{
                        primary: "#3b82f6",
                        "primary-dark": "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    }},
                    fontFamily: {{
                        display: ['Lexend', 'sans-serif'],
                    }},
                }}
            }}
        }}
    </script>
    <style>
        .animate-fade-in {{ animation: fadeIn 0.5s ease-out; }}
        @keyframes fadeIn {{ from {{ opacity: 0; transform: translateY(10px); }} to {{ opacity: 1; transform: translateY(0); }} }}
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
    <div class="layout-container flex flex-col h-full grow">
        <!-- Top Navigation Bar -->
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 py-4 sticky top-0 z-50">
            <a href="index.html" class="flex items-center gap-4 text-primary no-underline">
                <img class="w-6 h-6 object-contain shrink-0" style="width: 24px !important; height: 24px !important; min-width: 24px;" src="https://logic-play-one.vercel.app/logo.svg" alt="LogicPlay" />
                <h2 class="text-slate-900 dark:text-white text-xl font-extrabold leading-tight tracking-tight hidden sm:block">LogicPlay</h2>
            </a>
            
            <nav class="hidden xl:flex gap-8 items-center mx-auto">
                <div class="bg-primary/10 text-primary font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                    <span class="material-symbols-outlined">timer</span> <span id="timer-display">00:00</span>
                </div>
            </nav>
            
            <div class="flex items-center gap-4">
                <a class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold px-4 py-2 rounded-lg hover:bg-slate-200 transition-colors flex items-center gap-2" href="dashboard_matematicas.html">Salir</a>
            </div>
        </header>

        <main class="flex-1 px-4 py-8 md:px-8 max-w-4xl mx-auto w-full">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
                <h1 class="text-3xl font-black mb-2 flex items-center gap-2 text-indigo-600">
                    <span class="material-symbols-outlined text-4xl">emoji_events</span> Evento Especial: Matemáticas
                </h1>
                <p class="text-slate-500 mb-8 font-medium">Contesta correctamente a las 10 preguntas. ¡A más velocidad, más puntos!</p>

                <div id="quiz-container">
                    <!-- Preguntas dinamicas aqui -->
                </div>

                <div id="feedback-box" class="hidden mt-8"></div>
                
                <button id="btn-submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-4 rounded-xl mt-8 transition-colors flex justify-center items-center gap-2 text-lg" onclick="checkAnswers()">
                    Comprobar Resultados <span class="material-symbols-outlined">check_circle</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import {{ db }} from './firebase-firestore.js';
        import {{ doc, getDoc, updateDoc, increment }} from 'https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js';

        window.db = db;
        window.getDoc = getDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.increment = increment;
        
        window.startTime = Date.now();
        window.timerInterval = setInterval(() => {{
            const elapsed = Math.floor((Date.now() - window.startTime) / 1000);
            const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const s = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `${{m}}:${{s}}`;
        }}, 1000);
    </script>

    <script>
    const questions = [
        {q: 'La suma de las raíces de la función f(x) = x² - 5x + 6 es...', options: ['5', '-5', '6', '-6'], correct: 0},
        {q: '¿Cuál es el determinante de la matriz [[2, 1], [3, 4]]?', options: ['5', '8', '11', '5'], correct: 0},
        {q: 'La gráfica de una función cuadrática siempre es una...', options: ['Recta', 'Elipse', 'Parábola', 'Hipérbola'], correct: 2},
        {q: 'El vértice de la parábola f(x) = x² ocurre cuando x es igual a...', options: ['1', '0', '-1', 'No tiene vértice'], correct: 1},
        {q: 'En el método de Cramer se utilizan...', options: ['Sustitución directa', 'Determinantes', 'Gráficos', 'Porcentajes'], correct: 1},
        {q: 'Si el determinante de un sistema de 2x2 es Cero (0), entonces...', options: ['No tiene solución única', 'La solución es 0', 'Ambas variables valen cero', 'Solución infinita obligatoria'], correct: 0},
        {q: '¿Qué se obtiene al multiplicar una matriz por su matriz identidad?', options: ['Cero', 'La matriz transpuesta', 'Uno', 'La misma matriz original'], correct: 3},
        {q: 'El cruce del eje Y en f(x) = 2x² + 3x - 4 es...', options: ['(0, -4)', '(-4, 0)', '(0, 3)', '(2, 0)'], correct: 0},
        {q: 'Para sumar dos matrices, éstas deben ser de...', options: ['Cualquier tamaño', 'Dimensiones diferentes', 'Dimensiones iguales', 'Cuadradas obligatoriamente'], correct: 2},
        {q: 'La Regla de Sarrus se aplica exclusivamente a determinantes de...', options: ['Cualquier tamaño', '3x3', '2x2', 'Todo matriz cuadrada'], correct: 1}
    ];
    
    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';
        questions.forEach((item, index) => {
            html += `
            <div class="mb-6 p-5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100">
                <p class="font-bold mb-4 text-slate-800 text-lg">Pregunta ${index+1}: ${item.q}</p>
                <div class="grid md:grid-cols-2 gap-3">
                    ${item.options.map((opt, oIdx) => `
                        <label class="flex items-center gap-3 p-3 bg-white dark:bg-slate-800 border rounded-lg cursor-pointer hover:border-primary transition-colors">
                            <input type="radio" name="q${index}" value="${oIdx}" class="text-primary focus:ring-primary w-5 h-5">
                            <span class="font-medium">${opt}</span>
                        </label>
                    `).join('')}
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }
    
    window.checkAnswers = async function() {
        if(localStorage.getItem('logicplay_role') === 'profesor') return;
        
        const uid = localStorage.getItem('logicplay_uid');
        if(!uid) return;

        let score = 0;
        let answered = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if(selected) {
                answered++;
                if(parseInt(selected.value) === item.correct) score++;
            }
        });
        
        const btn = document.getElementById('btn-submit');
        const fb = document.getElementById('feedback-box');
        
        if(answered < 10) {
            fb.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold mb-4">¡Debes responder todas las preguntas!</div>`;
            fb.classList.remove('hidden');
            return;
        }

        clearInterval(window.timerInterval);
        btn.disabled = true;
        btn.innerHTML = `Guardando Puntaje... <span class="material-symbols-outlined animate-spin">refresh</span>`;

        if(score < 7) {
            fb.innerHTML = `<div class="bg-orange-50 text-orange-600 p-4 rounded-xl border border-orange-200 font-bold mb-4 text-center">¡Obtuviste ${score}/10! Debes acertar 7 o más para ganar puntos.</div>`;
            fb.classList.remove('hidden');
            btn.innerHTML = `Terminado`;
            return;
        }

        // Calculation algorithms
        const elapsedMin = (Date.now() - window.startTime) / 60000;
        let basePts = 1.0;
        if(elapsedMin > 3 && elapsedMin <= 5) basePts = 0.75;
        else if(elapsedMin > 5) basePts = 0.50;

        try {
            const userRef = window.doc(window.db, "users", uid);
            const userDoc = await window.getDoc(userRef);
            let mult = 1.0;
            if(userDoc.exists()) {
                const data = userDoc.data();
                const racha = data['racha_matematicas'] || 0;
                if(racha >= 8) mult = 1.25; // maximo 1.25 segun la orden
            }
            const finalPts = basePts * mult;

            await window.updateDoc(userRef, {
                'puntos_matematicas': window.increment(finalPts)
            });

            fb.innerHTML = `
                <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl flex flex-col items-center justify-center text-center animate-fade-in shadow-sm w-full">
                    <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm">
                        <span class="material-symbols-outlined text-emerald-500 text-3xl">star</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-2 uppercase tracking-wide">¡Evento Superado!</h3>
                    <p class="text-slate-600 font-medium">Acertaste ${score}/10.</p>
                    <p class="text-emerald-700 font-bold text-lg mt-2">+${finalPts.toFixed(2)} Puntos de Matemáticas</p>
                    <p class="text-xs text-slate-400 mt-1">Tiempo: ${Math.floor(elapsedMin)}m ${Math.floor((elapsedMin%1)*60)}s</p>
                </div>`;
            fb.classList.remove('hidden');
            btn.innerHTML = `Volver a Dashboard <span class="material-symbols-outlined">exit_to_app</span>`;
            btn.onclick = () => window.location.href = "dashboard_matematicas.html";
            btn.disabled = false;
        } catch (e) {
            console.error(e);
            fb.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 font-bold mb-4 text-center">Error guardando progreso. Revisa tu conexión.</div>`;
            fb.classList.remove('hidden');
        }
    };
    
    document.addEventListener("DOMContentLoaded", renderQuiz);

</script>
</body>
</html>
